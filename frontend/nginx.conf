# Serves the built SPA and load-balances /api across all `api` replicas.
# Docker's embedded DNS returns every replica's IP for "api"; the resolver +
# variable trick makes nginx re-resolve so newly scaled replicas are picked up.
server {
  listen 80;
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:4000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    # Server-Sent Events: don't buffer, don't time out long-lived streams.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
